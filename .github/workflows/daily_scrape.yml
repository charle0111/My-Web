name: Daily ETF Scrape

on:
  schedule:
    # 每天早上 21:00 UTC (台灣時間隔天 05:00) 執行一次
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python "ETF_00981A 持股分析.py"
        python "ETF_00981A 持股分析變化.py"
        python fetch_market_news.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add "ETF_00981A 持股分析.csv" "ETF_00981A 持股分析變化.csv" "ETF_00403A 持股分析.csv" "ETF_00403A 持股分析變化.csv" index.html reports/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ETF data and US stock report" && git push)
