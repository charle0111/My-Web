<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <title>ETF 淨值與持股歷史趨勢</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #1a202c;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    /* ETF 切換選單 */
    .etf-selector-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 0;
      justify-content: center;
    }

    .etf-selector-bar label {
      font-weight: 600;
      color: #475569;
    }

    #etfSelector {
      padding: 6px 14px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      outline: none;
      cursor: pointer;
      background: #f8fafc;
    }

    .chart-wrapper {
      width: 100%;
      height: 500px;
      margin-top: 30px;
    }

    .table-wrapper {
      margin-top: 40px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    th,
    td {
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #475569;
    }

    .section-header {
      background-color: #cbd5e1;
      font-weight: bold;
      text-align: left;
      font-size: 1.1rem;
      color: #1e293b;
    }

    .sub-section-header {
      background-color: #f1f5f9;
      font-weight: bold;
      text-align: left;
      color: #334155;
    }

    tbody tr:hover td {
      background-color: #f1f5f9;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>ETF 淨值與持股趨勢儀表板</h1>
    <p style="text-align: center; color: #666;">來自自動化的每日爬蟲更新資料，顯示淨值與成分股權重比例</p>

    <!-- ETF 切換選單 -->
    <div class="etf-selector-bar">
      <label for="etfSelector">選擇 ETF：</label>
      <select id="etfSelector">
        <option value="00981A">00981A 主動統一台股增長</option>
        <option value="00403A">00403A 主動統一升級50</option>
      </select>
    </div>

    <div class="chart-wrapper">
      <canvas id="myChart"></canvas>
    </div>
    <div id="report-container">
      <h2
        style="margin-top: 40px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
        <span id="reportTitle">持股變化分析報告</span>
        <select id="reportSelector"
          style="padding: 5px 10px; font-size: 1rem; border-radius: 6px; border: 1px solid #cbd5e1; outline: none; cursor: pointer;"></select>
      </h2>
      <div id="reportTableContainer"></div>
    </div>
  </div>

  <script>
    // ===================== ETF 資料來源設定 =====================
    const ETF_MAP = {
      '00981A': {
        history: 'ETF_00981A 持股分析.csv',
        changes: 'ETF_00981A 持股分析變化.csv',
      },
      '00403A': {
        history: 'ETF_00403A 持股分析.csv',
        changes: 'ETF_00403A 持股分析變化.csv',
      },
    };

    let chartInstance = null;

    // ===================== 載入圖表 =====================
    function loadChart(etfCode) {
      const { history } = ETF_MAP[etfCode];
      Papa.parse(history, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function (results) {
          // 過濾掉 nav_value 為空的占位列，然後依日期排序
          const data = results.data
            .filter(row => row['nav_value'] && row['nav_value'].trim() !== '')
            .sort((a, b) => new Date(a.date) - new Date(b.date));

          const labels = data.map(row => row.date);
          const navValues = data.map(row => {
            let val = row['每受益權單位淨資產價值(元)'];
            return val ? parseFloat(val) : null;
          });
          const totalIssued = data.map(row => {
            let val = row['已發行受益權單位總數'];
            return val ? (parseFloat(val) / 100000000) : null;
          });

          const ctx = document.getElementById('myChart').getContext('2d');

          // 銷毀舊圖表
          if (chartInstance) {
            chartInstance.destroy();
            chartInstance = null;
          }

          chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels,
              datasets: [
                {
                  label: '每單位淨資產價值(元)',
                  data: navValues,
                  borderColor: '#4a90e2',
                  backgroundColor: 'rgba(74, 144, 226, 0.1)',
                  yAxisID: 'y',
                  tension: 0.2,
                  fill: true
                },
                {
                  label: '發行單位總數 (億)',
                  data: totalIssued,
                  borderColor: '#2ecc71',
                  backgroundColor: 'transparent',
                  yAxisID: 'y2',
                  borderDash: [5, 5],
                  tension: 0.2
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: 'index', intersect: false },
              scales: {
                x: { title: { display: true, text: '日期' } },
                y: {
                  type: 'linear',
                  display: true,
                  position: 'left',
                  title: { display: true, text: '每單位淨值 (元)' },
                  suggestedMin: Math.min(...navValues.filter(n => n != null)) * 0.95
                },
                y2: {
                  type: 'linear',
                  display: true,
                  position: 'right',
                  title: { display: true, text: '單位總數 (億)' },
                  grid: { drawOnChartArea: false }
                }
              }
            }
          });
        }
      });
    }

    // ===================== 載入持股變化報表 =====================
    function loadReport(etfCode) {
      const { changes } = ETF_MAP[etfCode];
      const selector = document.getElementById('reportSelector');
      const tableContainer = document.getElementById('reportTableContainer');

      // 清空舊資料
      selector.innerHTML = '';
      tableContainer.innerHTML = '<p style="color:#999;">載入中...</p>';

      Papa.parse(changes, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function (results) {
          const data = results.data;
          if (!data || data.length === 0) {
            tableContainer.innerHTML = '<p style="color:#e53e3e;">找不到分析資料，請先執行 analyze_shares_change.py</p>';
            return;
          }

          const headers = data[0];
          const sections = [];
          let currentSection = null;

          for (let i = 1; i < data.length; i++) {
            const row = data[i];
            let nonEmpties = row.filter(c => c.trim() !== '');

            if (nonEmpties.length === 1 && row[0] && row[0].startsWith('[')) {
              currentSection = { title: row[0], rows: [] };
              sections.push(currentSection);
            } else if (currentSection) {
              if (nonEmpties.length === 0) continue;
              currentSection.rows.push(row);
            }
          }

          if (sections.length === 0) {
            tableContainer.innerHTML = '<p style="color:#e53e3e;">解析失敗，請確認 CSV 格式正確</p>';
            return;
          }

          // 填入下拉選單
          sections.forEach((sec, idx) => {
            const option = document.createElement('option');
            option.value = idx;
            option.text = sec.title;
            selector.appendChild(option);
          });

          function renderSection(index) {
            const sec = sections[index];
            let html = '<div class="table-wrapper"><table>';
            html += '<thead><tr>';
            headers.forEach(cell => html += `<th>${cell}</th>`);
            html += '</tr></thead><tbody>';

            sec.rows.forEach(row => {
              let nonEmpties = row.filter(c => c.trim() !== '');
              if (nonEmpties.length === 1) {
                html += '<tr>';
                if (row[1] && row[1].startsWith('---')) {
                  html += `<td colspan="${row.length}" class="sub-section-header">${row[1]}</td>`;
                } else {
                  html += `<td colspan="${row.length}" style="background:#f8fafc; font-weight:bold;">${nonEmpties[0]}</td>`;
                }
                html += '</tr>';
              } else {
                html += '<tr>';
                row.forEach(cell => { html += `<td>${cell}</td>`; });
                html += '</tr>';
              }
            });
            html += '</tbody></table></div>';
            tableContainer.innerHTML = html;
          }

          selector.addEventListener('change', (e) => renderSection(e.target.value));
          renderSection(0);
        },
        error: function () {
          tableContainer.innerHTML = `<p style="color:#e53e3e;">讀取 ${changes} 失敗，請確認檔案存在</p>`;
        }
      });
    }

    // ===================== 切換 ETF =====================
    function switchETF(etfCode) {
      document.getElementById('reportTitle').textContent = `${etfCode} 持股變化分析報告`;
      loadChart(etfCode);
      loadReport(etfCode);
    }

    // 監聽 ETF 選單切換
    document.getElementById('etfSelector').addEventListener('change', function () {
      switchETF(this.value);
    });

    // 初始載入預設的第一個 ETF
    switchETF(document.getElementById('etfSelector').value);
  </script>
</body>

</html>
